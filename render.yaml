services:
  - type: web
    name: burgerxan
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MY_TELEGRAM_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBAPP_URL
        sync: false
